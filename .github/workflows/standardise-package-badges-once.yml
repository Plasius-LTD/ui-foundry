name: Standardise package badges once

on:
  push:
    branches:
      - docs/standardise-package-badges

permissions:
  contents: write

jobs:
  standardise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: docs/standardise-package-badges
          fetch-depth: 0

      - name: Standardise repository and workspace badges
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const owner = 'Plasius-LTD';
          const repository = 'ui-foundry';

          function rewriteReadme({ path, packageName, rootPrefix, includeNpm }) {
            const source = fs.readFileSync(path, 'utf8').replace(/\r\n/g, '\n');
            const lines = source.split('\n');
            const title = lines.shift();

            if (!title?.startsWith('# ')) {
              throw new Error(`${path} must start with a level-one title`);
            }

            let bodyStart = 0;
            while (bodyStart < lines.length) {
              const line = lines[bodyStart].trim();
              if (line === '' || /^\[!\[.+\]\(.+\)\]\(.+\)$/.test(line)) {
                bodyStart += 1;
                continue;
              }
              break;
            }

            const badges = [];
            if (includeNpm) {
              badges.push(
                `[![npm version](https://img.shields.io/npm/v/${packageName}.svg)](https://www.npmjs.com/package/${packageName})`,
              );
            }

            badges.push(
              `[![Build Status](https://img.shields.io/github/actions/workflow/status/${owner}/${repository}/ci.yml?branch=main&label=build&style=flat)](https://github.com/${owner}/${repository}/actions/workflows/ci.yml)`,
              `[![coverage](https://img.shields.io/codecov/c/github/${owner}/${repository})](https://codecov.io/gh/${owner}/${repository})`,
              `[![License](https://img.shields.io/github/license/${owner}/${repository})](${rootPrefix}LICENSE)`,
              `[![Code of Conduct](https://img.shields.io/badge/code%20of%20conduct-yes-blue.svg)](${rootPrefix}CODE_OF_CONDUCT.md)`,
              `[![Security Policy](https://img.shields.io/badge/security%20policy-yes-orange.svg)](${rootPrefix}SECURITY.md)`,
              '[![Changelog](https://img.shields.io/badge/changelog-md-blue.svg)](./CHANGELOG.md)',
            );

            const body = lines.slice(bodyStart).join('\n').replace(/^\n+/, '');
            const output = `${title}\n\n${badges.join('\n')}\n\n${body}`;
            fs.writeFileSync(path, output.endsWith('\n') ? output : `${output}\n`);
          }

          rewriteReadme({
            path: 'README.md',
            packageName: null,
            rootPrefix: './',
            includeNpm: false,
          });
          rewriteReadme({
            path: 'packages/core/README.md',
            packageName: '@plasius/ui-foundry-core',
            rootPrefix: '../../',
            includeNpm: true,
          });
          rewriteReadme({
            path: 'packages/components/README.md',
            packageName: '@plasius/ui-foundry-components',
            rootPrefix: '../../',
            includeNpm: true,
          });
          rewriteReadme({
            path: 'packages/integrations/analytics-appinsights/README.md',
            packageName: '@plasius/ui-foundry-analytics-appinsights',
            rootPrefix: '../../../',
            includeNpm: true,
          });
          rewriteReadme({
            path: 'packages/cli/templates/README.md',
            packageName: '@plasius/ui-foundry-cli',
            rootPrefix: '../../../',
            includeNpm: true,
          });

          const workflowPath = '.github/workflows/ci.yml';
          let workflow = fs.readFileSync(workflowPath, 'utf8').replace(/\r\n/g, '\n');

          if (!workflow.includes('codecov/codecov-action@')) {
            const jobMarker = '  build-test:\n    runs-on: [self-hosted, Linux, X64]\n';
            if (!workflow.includes(jobMarker)) {
              throw new Error('Unable to find the build-test job marker');
            }
            workflow = workflow.replace(
              jobMarker,
              `${jobMarker}    permissions:\n      contents: read\n      id-token: write\n`,
            );

            const coverageMarker = '      - run: npm run test:coverage\n';
            if (!workflow.includes(coverageMarker)) {
              throw new Error('Unable to find the coverage command');
            }
            workflow = workflow.replace(
              coverageMarker,
              `${coverageMarker}      - name: Upload coverage to Codecov\n        uses: codecov/codecov-action@v7\n        with:\n          files: ./coverage/lcov.info\n          use_oidc: true\n          fail_ci_if_error: false\n`,
            );
          }

          fs.writeFileSync(workflowPath, workflow.endsWith('\n') ? workflow : `${workflow}\n`);
          NODE

      - name: Commit final repository changes
        run: |
          set -euo pipefail
          rm .github/workflows/standardise-package-badges-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md \
            packages/core/README.md \
            packages/components/README.md \
            packages/integrations/analytics-appinsights/README.md \
            packages/cli/templates/README.md \
            .github/workflows/ci.yml \
            .github/workflows/standardise-package-badges-once.yml
          git diff --cached --check
          git commit -m "docs: standardise package status badges"
          git push origin HEAD:docs/standardise-package-badges
